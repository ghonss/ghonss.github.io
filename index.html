<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reglas · UPV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;font-size:17px;transition:background .3s}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* ---------- Temas ---------- */
body[data-page="aula"]{--bg:#1d1245;--ink:#f3edff;--mute:#c4b4e6;--card:rgba(255,255,255,.06);--line:#b79cf2;--acc:#f2a900;--bar:#4a2377;--on-acc:#10283a;background-image:linear-gradient(rgba(200,175,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(200,175,255,.14) 1px,transparent 1px);background-size:28px 28px}
body[data-page="pasillos"]{--bg:#f6f1fb;--ink:#2a1544;--mute:#6b5486;--card:#ffffff;--line:#dccdf0;--acc:#6a3fa6;--acc2:#a37ad8;--bar:#5a2d82;--on-acc:#ffffff}
body[data-page="estacionamiento"]{--bg:#1f2227;--ink:#f5f5f5;--mute:#c1c6ce;--card:#2b2f36;--line:#444a54;--acc:#ffd400;--bar:#4a2377;--on-acc:#14161a}

/* ---------- Barra y menú ---------- */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;height:56px;padding:0 8px;background:var(--bar);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.bar button{width:48px;height:48px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:#fff;cursor:pointer}
.bar button:hover{background:rgba(255,255,255,.15)}
.bar .t{font-weight:700;font-size:1.02rem}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;left:0;bottom:0;z-index:40;width:min(86vw,330px);background:#fff;color:#10283a;transform:translateX(-102%);transition:transform .22s;display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,.3);visibility:hidden}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .drawer{transform:none;visibility:visible}
.drawer h2{margin:0;padding:20px 18px 10px;font-size:1.05rem}
.drawer p.s{margin:0;padding:0 18px 12px;color:#4b6070;font-size:.88rem}
.drawer a{display:flex;gap:12px;align-items:center;padding:12px 18px;text-decoration:none;border-left:6px solid transparent}
.drawer a:hover{background:#eef3f5}
.drawer a[aria-current="page"]{background:#fff3d1;border-left-color:#f2a900;font-weight:700}
.drawer .mi{flex:none;width:44px;height:44px;border-radius:10px;background:#eaf1f4;display:grid;place-items:center}
.drawer .mi svg{width:32px;height:32px}
.drawer small{display:block;font-weight:400;color:#4b6070}
@media (prefers-reduced-motion:reduce){.drawer,.scrim,body{transition:none}html{scroll-behavior:auto}}

/* ---------- Encabezado ---------- */
.hero{padding-top:30px;overflow:hidden}
.hero h1{margin:0 0 8px;font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.08;max-width:15em}
.hero p{margin:0;color:var(--mute);max-width:34em}
.hero svg.h{display:block;width:100%;height:auto;margin-top:18px}
body[data-page="pasillos"] .hero{background:var(--acc);color:#fff}
body[data-page="pasillos"] .hero p{color:#d8f4f1}
body[data-page="estacionamiento"] .hero{background:#14161a}
body[data-page="estacionamiento"] .hero h1{color:var(--acc)}

/* ---------- Secciones y reglas ---------- */
section{padding:30px 0 6px}
h2.sec{font-size:1.5rem;margin:0 0 4px}
.lead{color:var(--mute);margin:0 0 16px}
.rule h3{margin:0 0 3px;font-size:1.05rem}
.rule p{margin:0;font-size:.97rem}
.ic{flex:none;width:68px;height:68px;border-radius:12px;background:#f4f7f6;display:grid;place-items:center}
.ic svg{width:54px;height:54px}

/* Aula: plano técnico */
body[data-page="aula"] h2.sec{border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:10px}
body[data-page="aula"] .rule{display:flex;gap:16px;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:2px;padding:14px 16px;margin:0 0 12px;position:relative}
body[data-page="aula"] .rule::before{content:"";position:absolute;left:-1px;top:-1px;width:14px;height:14px;border-top:3px solid var(--acc);border-left:3px solid var(--acc)}
body[data-page="aula"] .safety .rule{border-color:#ff8a7a}
body[data-page="aula"] .safety .rule::before{border-color:#ff8a7a}

/* Pasillos: señalización */
body[data-page="pasillos"] .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
body[data-page="pasillos"] h2.sec{display:inline-block;background:var(--acc);color:#fff;padding:6px 26px 6px 16px;border-radius:10px 0 0 10px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%);margin-bottom:10px}
body[data-page="pasillos"] .rule{display:flex;align-items:stretch;background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden;position:relative;margin:0}
body[data-page="pasillos"] .rule .ic{width:84px;height:auto;min-height:84px;border-radius:0;background:var(--acc)}
body[data-page="pasillos"] .rule:nth-child(3n+2) .ic{background:var(--acc2)}
body[data-page="pasillos"] .rule:nth-child(3n) .ic{background:#12302f}
body[data-page="pasillos"] .rule .ic svg{background:#fff;border-radius:10px;padding:3px}
body[data-page="pasillos"] .rule>div:last-child{padding:12px 34px 12px 14px}
body[data-page="pasillos"] .rule::after{content:"\203A";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:1.8rem;color:var(--acc);font-weight:700}
body[data-page="pasillos"] .safety .rule{border-color:#ffc2b5}

/* Estacionamiento: señales viales */
body[data-page="estacionamiento"] .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
body[data-page="estacionamiento"] section{border-top:4px dashed var(--acc);margin-top:14px;padding-top:24px}
body[data-page="estacionamiento"] section:first-of-type{border-top:0;margin-top:0}
body[data-page="estacionamiento"] h2.sec{color:var(--acc)}
body[data-page="estacionamiento"] .rule{background:var(--card);border:3px solid var(--acc);border-radius:16px;padding:16px;box-shadow:inset 0 0 0 3px var(--card)}
body[data-page="estacionamiento"] .rule .ic{margin-bottom:10px;border-radius:50%;width:72px;height:72px}
body[data-page="estacionamiento"] .safety .rule{border-color:#ff6a5a}
body[data-page="estacionamiento"] .rule p{color:#d9dde3}

/* ---------- Comunes ---------- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.col h3{margin:0 0 8px;font-size:1.1rem}
.col.yes{border-top:6px solid #1d8a5a}
.col.nop{border-top:6px solid #e0594b}
.col ul{margin:0;padding-left:20px}
.col li{margin-bottom:6px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:.95rem}
.steps b{display:block;margin-bottom:4px}
.note{margin:30px 0;background:var(--card);border:1px dashed var(--mute);border-radius:8px;padding:14px 16px;font-size:.9rem;color:var(--mute)}
footer{background:var(--bar);color:#cfe0ea;text-align:center;padding:22px 18px;font-size:.9rem}
@media (max-width:680px){.cols,body[data-page="pasillos"] .grid,body[data-page="estacionamiento"] .grid{grid-template-columns:1fr}body{font-size:16px}.ic{width:56px;height:56px}.ic svg{width:44px;height:44px}body[data-page="pasillos"] .rule .ic{width:70px}}

/* ---------- Morado y blanco ---------- */
body::before,body::after{content:"";position:fixed;top:0;bottom:0;width:7px;z-index:15;pointer-events:none;background:#fff}
body::before{left:0;box-shadow:inset -3px 0 0 #7a4cb8}
body::after{right:0;box-shadow:inset 3px 0 0 #7a4cb8}
.bar{background:linear-gradient(90deg,var(--bar),#7a4cb8)}
footer{background:linear-gradient(90deg,var(--bar),#7a4cb8)}
.bar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prog{position:absolute;left:0;bottom:0;height:4px;width:0;background:linear-gradient(90deg,#fff,#c9a8ff)}
.drawer h2{background:#5a2d82;color:#fff;padding:22px 18px 8px}
.drawer p.s{background:#5a2d82;color:#e3d5f7;padding-bottom:14px}
.drawer a:hover{background:#f6f1fb}
.drawer a[aria-current="page"]{background:#efe7f7;border-left-color:#5a2d82}
.drawer .mi{background:#efe7f7}
body[data-page="aula"] .hero{background:linear-gradient(135deg,#3a1a6e,#1d1245)}
body[data-page="aula"] .rule::before{border-top-color:#fff;border-left-color:#fff}
body[data-page="aula"] h2.sec{border-bottom-color:#fff}
body[data-page="pasillos"] .hero{background:linear-gradient(135deg,#5a2d82,#8a5cc8);color:#fff}
body[data-page="pasillos"] .hero p{color:#eadcfb}
body[data-page="pasillos"] .rule:nth-child(3n) .ic{background:#2a1544}
body[data-page="estacionamiento"] .hero{background:linear-gradient(180deg,#4a2377,#1f2227)}
body[data-page="estacionamiento"] .hero h1{color:#fff}
body[data-page="estacionamiento"] .hero p{color:#e3d5f7}
body[data-page="estacionamiento"] section{border-top-color:#fff}
body[data-page="estacionamiento"] h2.sec{color:#fff}
body[data-page="estacionamiento"] h2.sec::after{content:"";display:block;width:64px;height:4px;background:#a37ad8;margin-top:4px;border-radius:2px}
body[data-page="estacionamiento"] .rule{border-color:#fff;box-shadow:inset 0 0 0 4px #4a2377}

/* ---------- Animaciones ---------- */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.8)}}
@keyframes dash{to{stroke-dashoffset:-44}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes walkx{from{transform:translateX(-120px)}to{transform:translateX(980px)}}
@keyframes drive{from{transform:translateX(-420px)}}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes sway{from{transform:translateX(-16px)}to{transform:translateX(16px)}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes heroin{from{opacity:0;transform:translateY(-14px)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes wig{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes slidein{from{opacity:0;transform:translateX(-24px)}}
@keyframes wipe{0%{transform:translateX(-101%)}45%,55%{transform:translateX(0)}100%{transform:translateX(101%)}}
.spin,.spinr,.glow,.wob,.pulse{transform-box:fill-box;transform-origin:center}
.spin{animation:spin 10s linear infinite}
.spinr{animation:spinr 5.8s linear infinite}
.glow{animation:glow 2.4s ease-in-out infinite}
.wob{animation:wob 3s ease-in-out infinite}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.d2{animation-delay:.6s}
.d3{animation-delay:1.2s}
.flow{animation:none}
.flow path{animation:dash 1.4s linear infinite}
.bob{animation:bob 2.2s ease-in-out infinite}
.walkx{animation:walkx 16s linear infinite}
.sway{animation:sway 3s ease-in-out infinite alternate}
.drive{animation:drive 1.4s cubic-bezier(.2,.8,.2,1) backwards}
.drive.d2{animation-delay:.35s}
.enter h1{animation:heroin .7s ease-out backwards}
.enter p{animation:heroin .7s .12s ease-out backwards}
.rv{opacity:0}
.rv.in{opacity:1;animation:rise .55s ease-out backwards;animation-delay:var(--d,0s)}
.rule{position:relative;transition:transform .2s,box-shadow .2s}
.rule:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(40,10,80,.22)}
.rule:hover .ic svg{animation:wig .5s}
.col li,.steps li{transition:transform .2s}
.steps li:hover{transform:translateY(-3px)}
.curtain{position:fixed;inset:0;z-index:50;background:linear-gradient(90deg,#4a2377,#7a4cb8);transform:translateX(-101%);pointer-events:none}
.curtain::after{content:"";position:absolute;top:0;bottom:0;right:0;width:16px;background:#fff}
.curtain.run{animation:wipe .75s cubic-bezier(.7,0,.3,1)}
body.open .drawer a{animation:slidein .35s backwards}
body.open .drawer a:nth-of-type(2){animation-delay:.07s}
body.open .drawer a:nth-of-type(3){animation-delay:.14s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1}}
.drawer{overflow-y:auto}
.drawer p.s2{margin:10px 18px 4px;padding-top:12px;border-top:2px solid #efe7f7;color:#5a2d82;font-weight:700;font-size:.85rem}
.drawer a.ext{margin:6px 12px;padding:10px 12px;border:2px solid #d9c6f5;border-left-width:6px;border-radius:12px}
.drawer a.ext:hover{background:#efe7f7;border-color:#7a4cb8}
.drawer a.ext::after{content:"\2197";margin-left:auto;color:#5a2d82;font-weight:700}
body.open .drawer a:nth-of-type(4){animation-delay:.21s}
body.open .drawer a:nth-of-type(5){animation-delay:.28s}

/* ---------- Tipografía ---------- */
:root{--fb:"Nunito","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{font-family:var(--fb);font-size:18px;line-height:1.6}
body[data-page="aula"]{--fd:"Chakra Petch","Segoe UI",Roboto,sans-serif}
body[data-page="pasillos"]{--fd:"Fredoka","Segoe UI",Roboto,sans-serif}
body[data-page="estacionamiento"]{--fd:"Oswald","Arial Narrow",Arial,sans-serif}
.hero h1,h2.sec,.rule h3,.col h3,.steps b,.bar .t,.drawer h2{font-family:var(--fd,var(--fb))}
.hero h1{font-size:clamp(2.3rem,8.5vw,3.7rem);font-weight:700;line-height:1.04;letter-spacing:.01em;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.hero p{font-size:1.15rem;font-weight:600}
h2.sec{font-size:1.85rem;font-weight:700;line-height:1.15}
.lead{font-size:1.07rem;font-weight:600}
.rule h3{font-size:1.25rem;font-weight:700;line-height:1.2;margin-bottom:4px}
.rule p{font-size:1.03rem}
.col h3{font-size:1.3rem;font-weight:700}
.col li{font-size:1.03rem;font-weight:600}
.steps b{font-size:1.1rem;font-weight:700}
.steps li{font-size:1rem}
.note{font-size:.97rem}
.bar .t{font-size:1.1rem;font-weight:600;letter-spacing:.02em}
.drawer small{font-weight:600}
body[data-page="pasillos"] h2.sec{font-weight:600}
body[data-page="estacionamiento"] .hero h1{font-size:clamp(2.6rem,9.5vw,4.2rem);font-weight:600;letter-spacing:.03em}
body[data-page="estacionamiento"] h2.sec{font-weight:600;letter-spacing:.02em}
body[data-page="estacionamiento"] .rule h3{font-weight:600;letter-spacing:.01em;font-size:1.35rem}
@media (max-width:680px){body{font-size:17px}}

/* ---------- Formas suaves y redondeadas ---------- */
.blob{position:fixed;z-index:-1;border-radius:50%;filter:blur(60px);pointer-events:none;opacity:.4;animation:float 14s ease-in-out infinite alternate}
.blob.b1{top:14%;left:-110px;width:320px;height:320px;background:#8a5cc8}
.blob.b2{bottom:4%;right:-120px;width:360px;height:360px;background:#b79cf2;animation-delay:-6s}
body[data-page="pasillos"] .blob{opacity:.3}
@keyframes float{to{transform:translate(50px,-60px) scale(1.18)}}
.hero{border-radius:0 0 44px 44px}
.bar{border-radius:0 0 22px 22px}
footer{border-radius:34px 34px 0 0;margin-top:26px}
.col,.steps li,.note{border-radius:24px}
.col{padding:18px 20px}
.steps li{padding:16px}
.ic{border-radius:20px}
body[data-page="aula"] .rule{border-radius:22px;padding:16px 18px}
body[data-page="aula"] .rule::before{width:26px;height:26px;border-top-left-radius:22px}
body[data-page="aula"] h2.sec{border-bottom-width:3px;border-radius:0 0 8px 8px}
body[data-page="pasillos"] .rule{border-radius:28px}
body[data-page="pasillos"] .rule .ic svg{border-radius:18px}
body[data-page="pasillos"] h2.sec{clip-path:none;border-radius:999px;padding:6px 24px}
body[data-page="estacionamiento"] .rule{border-radius:30px;padding:18px 18px 20px}
body[data-page="estacionamiento"] .rule .ic{box-shadow:0 4px 0 rgba(0,0,0,.25)}
.rule{transition:transform .25s cubic-bezier(.3,1.5,.5,1),box-shadow .25s}
.rule:hover{transform:translateY(-5px) scale(1.01);box-shadow:0 16px 30px rgba(74,35,119,.32)}
.rule:hover .ic{transform:rotate(-6deg)}
.ic{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.steps li:hover{transform:translateY(-4px) rotate(-.6deg)}

/* ---------- Menú renovado ---------- */
.bar button{transition:background .2s,transform .2s}
.bar button:active{transform:scale(.88)}
.bar button svg{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.bar button:hover svg{transform:scale(1.18)}
body.open #mb svg{transform:rotate(90deg) scale(1.1)}
.scrim{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.drawer{width:min(88vw,340px);border-radius:0 32px 32px 0;padding-bottom:18px}
.dh{position:relative;overflow:hidden;background:linear-gradient(135deg,#4a2377,#8a5cc8);color:#fff;border-radius:0 0 34px 0;margin-bottom:10px;padding-bottom:6px}
.dh::before{content:"";position:absolute;right:-34px;top:-54px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.15);animation:float 9s ease-in-out infinite alternate}
.dh::after{content:"";position:absolute;left:58%;bottom:-46px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.1);animation:float 11s ease-in-out infinite alternate-reverse}
.dh h2,.dh p.s{position:relative;z-index:1;background:transparent;color:#fff}
.dh h2{font-size:1.45rem;padding:22px 60px 4px 20px}
.dh p.s{padding:0 20px 14px;color:#eadcfb}
.x{position:absolute;top:12px;right:12px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:1.5rem;line-height:1;cursor:pointer;transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .2s}
.x:hover{transform:rotate(90deg) scale(1.1);background:rgba(255,255,255,.4)}
.drawer a{position:relative;overflow:hidden;margin:4px 12px;padding:10px 12px;border-left:0;border-radius:20px;transition:transform .25s cubic-bezier(.3,1.5,.5,1),background .2s,box-shadow .25s;font-size:1.02rem}
.drawer a:hover{transform:translateX(7px);background:#f3ecfb;box-shadow:0 8px 18px rgba(90,45,130,.18)}
.drawer a:active{transform:translateX(7px) scale(.97)}
.drawer .mi{border-radius:16px;transition:transform .3s cubic-bezier(.3,1.7,.5,1),background .2s,box-shadow .2s}
.drawer a:hover .mi{transform:rotate(-10deg) scale(1.15);background:#fff;box-shadow:0 4px 10px rgba(90,45,130,.25)}
.drawer a:hover .mi svg{animation:wig .5s}
.drawer a[aria-current="page"]{background:linear-gradient(135deg,#5a2d82,#8a5cc8);color:#fff;box-shadow:0 8px 18px rgba(90,45,130,.35)}
.drawer a[aria-current="page"] small{color:#eadcfb}
.drawer a[aria-current="page"] .mi{background:#fff}
.drawer a[aria-current="page"]::after{content:"";margin-left:auto;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:ping 1.6s infinite}
.drawer a.sel{animation:selpulse .3s ease}
.drawer a.ext{margin:6px 12px;padding:10px 12px;border:2px solid #d9c6f5;border-radius:20px}
.drawer a.ext:hover{background:#f3ecfb;border-color:#7a4cb8}
.drawer a.ext::after{transition:transform .25s}
.drawer a.ext:hover::after{transform:translate(4px,-4px)}
.drawer p.s2{border-top-style:dashed}
.rip{position:absolute;width:10px;height:10px;border-radius:50%;background:rgba(138,92,200,.4);transform:translate(-50%,-50%) scale(0);animation:rip .65s ease-out forwards;pointer-events:none}
.drawer a[aria-current="page"] .rip{background:rgba(255,255,255,.45)}
@keyframes rip{to{transform:translate(-50%,-50%) scale(34);opacity:0}}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@keyframes selpulse{50%{transform:scale(1.05)}}

/* ---------- v3: interfaz más viva + menú dinámico ---------- */
@keyframes gshift{to{background-position:100% 100%}}
@keyframes dotwave{0%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}60%{transform:translateY(2px)}}
@keyframes tin{from{opacity:0;transform:translateX(-18px) scale(.9)}}

/* botón de 3 puntitos */
.dot{transform-box:fill-box;transform-origin:center}

body.open #mb .dot:nth-child(2){animation-delay:.15s}
body.open #mb .dot:nth-child(3){animation-delay:.3s}

/* menú: foco de luz, insignias, índice de la página */
.drawer{transition:transform .38s cubic-bezier(.2,1.1,.3,1);will-change:transform}
.drawer a::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(circle 110px at var(--mx,50%) var(--my,50%),rgba(138,92,200,.28),transparent 70%)}

.drawer a:hover .bd{transform:scale(1.12)}
.drawer a[aria-current="page"] .bd{background:rgba(255,255,255,.28);color:#fff}
.drawer a[aria-current="page"]::after{margin-left:8px}
.toc{padding:0 12px 6px}

.tl{display:flex;flex-direction:column;gap:2px;position:relative;margin-left:10px;padding-left:14px;border-left:3px solid #e6d9f6}
.tb{position:relative;display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;color:#2a1544;font:inherit;font-size:.95rem;font-weight:700;padding:8px 10px;border-radius:14px;cursor:pointer;transition:background .2s,transform .2s,color .2s}
.tb::before{content:"";position:absolute;left:-20px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:#fff;border:3px solid #cdb6ee;transition:all .25s cubic-bezier(.3,1.7,.5,1)}
.tb:hover{background:#f3ecfb;transform:translateX(5px)}
.tb.on{background:#efe7f7;color:#5a2d82}
.tb.on::before{background:#7a4cb8;border-color:#7a4cb8;transform:scale(1.35);box-shadow:0 0 0 5px rgba(122,76,184,.22)}

.drawer a:focus-visible,.tb:focus-visible{outline:3px solid #7a4cb8;outline-offset:-2px}

/* tarjetas con inclinación 3D */
.rule{will-change:transform;transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}

.rule:hover .ic svg,.rule.pop .ic svg{animation:boing .75s cubic-bezier(.3,1.2,.5,1)}

/* listas Sí / No con marcas animadas */
.col ul{list-style:none;padding-left:0}

.col li::before{position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;color:#fff;transform:scale(0)}

.fab svg{position:relative;transition:transform .3s}

.fab:hover{transform:scale(1.12)}
.fab:hover svg{transform:translateY(-3px)}

/* ---------- Animación de íconos al elegir una página ---------- */
@keyframes gearspin{0%{transform:rotate(0) scale(1)}15%{transform:rotate(-25deg) scale(1.1)}100%{transform:rotate(720deg) scale(1)}}
@keyframes walkmi{0%{transform:translate(0,0)}12%{transform:translate(7px,-3px)}24%{transform:translate(14px,0)}36%{transform:translate(22px,-3px)}46%{transform:translate(40px,0)}47%{transform:translate(-40px,0)}60%{transform:translate(-26px,-3px)}74%{transform:translate(-14px,0)}88%{transform:translate(-5px,-3px)}100%{transform:translate(0,0)}}
@keyframes carpass{from{transform:translateX(-52px)}to{transform:translateX(52px)}}

.drawer .mi{position:relative;overflow:hidden}

.cols .col{position:relative;overflow:hidden;border:0;padding:0 20px 14px;box-shadow:0 12px 26px rgba(20,8,50,.28);transition:transform .3s cubic-bezier(.3,1.5,.5,1),box-shadow .3s}

.cols .col.nop h3{background:linear-gradient(135deg,#c93a2f,#f27a6c)}

.cols .col.nop h3::after{content:"\2715"}

.cols .col li:last-child{border-bottom:0}
.cols .col li::before{top:8px}

/* ---------- Si no se cumple una regla: advertencia ---------- */
section:has(> .steps) h2.sec::before{content:"\26A0\FE0F";display:inline-block;margin-right:10px;animation:wob 1.8s ease-in-out infinite}
.steps{counter-reset:st}

.steps li:nth-child(3)::before{content:"\1F6A8";border-color:#d6453a;animation:glow 1s ease-in-out infinite}
.steps li::after{content:"Paso " counter(st);position:absolute;top:16px;right:14px;font-size:.75rem;font-weight:800;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.12)}

  secs: [
   {t:"Circulación", l:"Los pasillos son zonas de paso. Que fluyan es cuestión de seguridad y de cortesía.", r:[
    ["walk","Camina, no corras","Evita carreras y juegos bruscos, sobre todo en escaleras, esquinas y accesos. Circula por tu derecha."],
    ["team","No bloquees el paso","Si platicas en grupo, hazlo a un lado. Mochilas, bicicletas y objetos personales no deben quedar en el piso del pasillo, rampas ni puertas."]]},
   {t:"Convivencia", l:"Mientras tú estás en descanso, otros grupos están en clase.", r:[
    ["quiet","Mantén un volumen moderado","Evita gritos, bocinas y música sin audífonos cerca de aulas, laboratorios, biblioteca y oficinas."],
    ["phone2","Llamadas y videos con cuidado","Contesta llamadas lejos de las puertas de las aulas. No grabes ni fotografíes a personas sin su permiso."],
    ["team","Respeto a toda la comunidad","Estudiantes, docentes, personal administrativo, de intendencia y de seguridad merecen buen trato. No se toleran burlas, acoso, discriminación ni violencia, ni física ni verbal."]]},
   {t:"Cuidado del espacio", l:"Las instalaciones son de todos y las usamos todos los días.", r:[
    ["trash","Tira la basura donde corresponde","Usa los botes y separa los residuos cuando haya contenedores. Los alimentos se consumen en las zonas destinadas para ello."],
    ["pin","Carteles solo donde se autorice","No pegues anuncios en paredes, puertas ni vidrios. Pide autorización para colocar avisos o promover eventos."],
    ["gear","Cuida mobiliario y equipo","No rayes, rompas ni muevas bancas, extintores, señalética, pantallas ni cableado. Si ves un desperfecto, repórtalo."]]},
   {t:"Seguridad", cls:"safety", l:"Una salida despejada puede marcar la diferencia en una emergencia.", r:[
    ["exit","Conoce las rutas de evacuación","Ubica salidas, puntos de reunión, extintores y botiquín. En simulacros y emergencias, sigue las indicaciones del personal y de protección civil."],
    ["nosmoke","Sin tabaco, alcohol ni sustancias","El consumo o posesión de tabaco, alcohol, vapeadores y otras sustancias no está permitido en las instalaciones, conforme a la normativa universitaria y a la ley."],
    ["warn","Avisa de inmediato","Derrames, cables expuestos, personas lastimadas o situaciones sospechosas se reportan al personal de seguridad, a un docente o a la coordinación."],
    ["chip","Porta tu credencial","Llévala visible o a la mano para acceder a las instalaciones y presentarla si el personal la solicita."]]}
  ],
  yes:["Caminar por la derecha y con calma","Dejar libres pasillos, rampas y salidas","Hablar en volumen moderado","Tirar la basura en su bote","Reportar daños y emergencias","Tratar bien a todas las personas"],
  no:["Correr ni empujar","Dejar mochilas u objetos en el paso","Poner música o gritar cerca de aulas","Pegar carteles sin permiso","Fumar, vapear o consumir alcohol","Grabar a otras personas sin su permiso"],
  steps:[["Llamada de atención","El personal de la universidad te indica la falta y cómo corregirla."],["Reporte del prefecto","Si se repite, el prefecto te llama la atención y te levanta un reporte, que se informa a la coordinación de tu carrera."],["Medidas del reglamento","Las faltas graves se atienden con lo que marque la normativa oficial de la UPV."]],

function afterRender(){
  var els = app.querySelectorAll(".rule,.col,.col li,.steps li,.note,h2.sec");
  if (io) io.disconnect();
  Array.prototype.forEach.call(els, function(el){
    var idx = Array.prototype.indexOf.call(el.parentNode.children, el);
    el.style.setProperty("--d", (Math.min(idx, 8) * 0.07) + "s");

  if (reduce || !("IntersectionObserver" in window)) {
    Array.prototype.forEach.call(els, function(el){ el.classList.add("in"); });
    return;
  }
  io = new IntersectionObserver(function(en){
    en.forEach(function(x){ if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } });
  }, {threshold: 0.12, rootMargin: "0px 0px -6% 0px"});

}

}

function ripple(a, e){
  if (reduce) return;
  var r = a.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (!e.clientX && !e.clientY) { x = r.width / 2; y = r.height / 2; }

  d.className = "rip"; d.style.left = x + "px"; d.style.top = y + "px";
  a.appendChild(d);
  setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 700);

    fab.style.setProperty("--p", (h > 0 ? Math.min(1, y / h) * 360 : 0) + "deg");
    fab.classList.toggle("show", y > 360);
    if (!reduce) hsEl.style.transform = "translateY(" + Math.min(y * 0.18, 60) + "px)";
    var act = null, line = window.innerHeight * 0.4;
    secs.forEach(function(o){ if (o.sec.getBoundingClientRect().top < line) act = o; });
    secs.forEach(function(o){ o.b.classList.toggle("on", o === act); });
  }
  window.addEventListener("scroll", function(){
    if (tick) return; tick = true;
    requestAnimationFrame(function(){ tick = false; onScroll(); });
  }, {passive: true});

  // Foco de luz que sigue al puntero en el menú
  menuEl.addEventListener("pointermove", function(e){
    var a = e.target.closest && e.target.closest("a"); if (!a) return;
    var r = a.getBoundingClientRect();
    a.style.setProperty("--mx", (e.clientX - r.left) + "px");
    a.style.setProperty("--my", (e.clientY - r.top) + "px");
  });

  // Inclinación 3D de las tarjetas (solo con ratón)
  var last = null;
  function reset(c){ if (c) { c.style.setProperty("--rx", "0deg"); c.style.setProperty("--ry", "0deg"); } }
  appEl.addEventListener("pointermove", function(e){
    if (reduce || e.pointerType !== "mouse") return;
    var c = e.target.closest(".rule");
    if (c !== last) { reset(last); last = c; }
    if (!c) return;
    var r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
    c.style.setProperty("--ry", (x * 8) + "deg"); c.style.setProperty("--rx", (-y * 8) + "deg");
  });
  appEl.addEventListener("pointerleave", function(){ reset(last); last = null; });

  // Deslizar el menú hacia la izquierda para cerrarlo
  var sx = null, dx = 0;
  menuEl.addEventListener("touchstart", function(e){ sx = e.touches[0].clientX; dx = 0; menuEl.style.transition = "none"; }, {passive: true});
  menuEl.addEventListener("touchmove", function(e){
    if (sx === null) return;
    dx = Math.min(0, e.touches[0].clientX - sx);
    menuEl.style.transform = "translateX(" + dx + "px)";
    $("sc").style.opacity = Math.max(0, 1 + dx / 320);
  }, {passive: true});
  menuEl.addEventListener("touchend", function(){
    if (sx === null) return;
    var close = dx < -70;
    menuEl.style.transition = ""; menuEl.style.transform = ""; $("sc").style.opacity = "";
    sx = null;
    if (close) setMenu(false);
  });

  // Íconos animados al elegir una página (engrane gira, persona camina, auto pasa por la P)
  var CAR = '<svg class="car" viewBox="0 0 64 40" aria-hidden="true"><path d="M18 20l7-11h16l9 11z" fill="#dbe7ee" stroke="#10283a" stroke-width="2.5" stroke-linejoin="round"/><rect x="4" y="19" width="56" height="13" rx="5" fill="#f2a900" stroke="#10283a" stroke-width="2.5"/><path d="M33 10v9" stroke="#10283a" stroke-width="2.5"/><rect x="55" y="22" width="4" height="4" rx="1" fill="#fff"/><g class="wh"><circle cx="18" cy="33" r="5.5" fill="#10283a"/><path d="M18 29v8M14 33h8" stroke="#dbe7ee" stroke-width="1.6"/></g><g class="wh"><circle cx="46" cy="33" r="5.5" fill="#10283a"/><path d="M46 29v8M42 33h8" stroke="#dbe7ee" stroke-width="1.6"/></g></svg>';
  var pm = menuEl.querySelector('a[href="#estacionamiento"] .mi');
  if (pm) pm.insertAdjacentHTML("beforeend", CAR);
  var RUN = {aula: "run-gear", pasillos: "run-walk", estacionamiento: "run-p"}, busy = false;
  menuEl.addEventListener("click", function(e){
    var a = e.target.closest("a");
    if (!a || reduce) return;
    var k = (a.getAttribute("href") || "").replace("#", "");
    if (a.getAttribute("href").charAt(0) !== "#" || !RUN[k]) return;
    e.preventDefault(); e.stopPropagation();
    if (busy) return;
    busy = true;
    ripple(a, e);
    var mi = a.querySelector(".mi");
    mi.classList.add(RUN[k]);
    setTimeout(function(){
      mi.classList.remove(RUN[k]);
      go(k);
      try { location.hash = k; } catch (err) {}
      a.classList.add("sel");
      setTimeout(function(){ a.classList.remove("sel"); setMenu(false); busy = false; }, 220);
    }, 820);
  }, true);

  // Al tocar una regla (celular o ratón) el ícono rebota
  appEl.addEventListener("click", function(e){
    var c = e.target.closest(".rule");
    if (!c || reduce) return;
    c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop");
    setTimeout(function(){ c.classList.remove("pop"); }, 800);
  });

  // Teclado: flechas para moverse por el menú
  document.addEventListener("keydown", function(e){
    if (!isMenu() || (e.key !== "ArrowDown" && e.key !== "ArrowUp")) return;
    var items = Array.prototype.slice.call(menuEl.querySelectorAll("a")), i = items.indexOf(document.activeElement);
    e.preventDefault();
    i = e.key === "ArrowDown" ? (i + 1) % items.length : (i - 1 + items.length) % items.length;
    items[i].focus();
  });
})();

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
